<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="470" fill="#ffffff"/>

  <!-- column headings -->
  <text x="20"  y="28" font-size="12" font-weight="600" fill="#6b7785" letter-spacing="0.6">SOURCE</text>
  <text x="330" y="28" font-size="12" font-weight="600" fill="#6b7785" letter-spacing="0.6">LOAD</text>
  <text x="640" y="28" font-size="12" font-weight="600" fill="#6b7785" letter-spacing="0.6">WAREHOUSE, DUCKDB SQL</text>
  <text x="980" y="28" font-size="12" font-weight="600" fill="#6b7785" letter-spacing="0.6">OUTPUT</text>

  <!-- source -->
  <rect x="20" y="44" width="260" height="118" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="20" y="44" width="260" height="4" rx="2" fill="#2a78d6"/>
  <text x="38" y="74" font-size="14" font-weight="600" fill="#1c2630">SEC Form N-PORT data sets</text>
  <text x="38" y="96" font-size="12" fill="#5b6773">Four quarterly postings, 32 tables each,</text>
  <text x="38" y="114" font-size="12" fill="#5b6773">about 440 MB zipped per quarter.</text>
  <text x="38" y="138" font-size="12" fill="#8a949e">Fetched in a browser or by the</text>
  <text x="38" y="153" font-size="12" fill="#8a949e">fetch-nport.yml Actions workflow.</text>

  <rect x="20" y="186" width="260" height="96" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="20" y="186" width="260" height="4" rx="2" fill="#eb6834"/>
  <text x="38" y="216" font-size="14" font-weight="600" fill="#1c2630">GLEIF LEI registry</text>
  <text x="38" y="238" font-size="12" fill="#5b6773">Legal name, status, head office,</text>
  <text x="38" y="256" font-size="12" fill="#5b6773">successor entity, ultimate parent.</text>

  <!-- load -->
  <rect x="330" y="44" width="260" height="118" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="330" y="44" width="260" height="4" rx="2" fill="#2a78d6"/>
  <text x="348" y="74" font-size="14" font-weight="600" fill="#1c2630">scripts/ingest.py</text>
  <text x="348" y="96" font-size="12" fill="#5b6773">Loads all 32 tables into DuckDB with</text>
  <text x="348" y="114" font-size="12" fill="#5b6773">every column as text, so nothing is</text>
  <text x="348" y="132" font-size="12" fill="#5b6773">coerced on the way in.</text>

  <rect x="330" y="186" width="260" height="96" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="330" y="186" width="260" height="4" rx="2" fill="#eb6834"/>
  <text x="348" y="216" font-size="14" font-weight="600" fill="#1c2630">scripts/fetch_gleif.py</text>
  <text x="348" y="238" font-size="12" fill="#5b6773">Looks up every borrower LEI and rolls</text>
  <text x="348" y="256" font-size="12" fill="#5b6773">it up to the parent group. Cached.</text>

  <!-- warehouse -->
  <rect x="640" y="44" width="290" height="238" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="640" y="44" width="290" height="4" rx="2" fill="#1baf7a"/>

  <text x="658" y="74" font-size="12" font-weight="600" fill="#1baf7a">01</text>
  <text x="686" y="74" font-size="13" fill="#1c2630">Resolve each borrower to a group</text>
  <text x="658" y="106" font-size="12" font-weight="600" fill="#1baf7a">02</text>
  <text x="686" y="106" font-size="13" fill="#1c2630">One snapshot per fund per posting</text>
  <text x="658" y="138" font-size="12" font-weight="600" fill="#1baf7a">03</text>
  <text x="686" y="138" font-size="13" fill="#1c2630">Exposure, and reconcile the two</text>
  <text x="686" y="155" font-size="13" fill="#1c2630">lending reports in each filing</text>
  <text x="658" y="187" font-size="12" font-weight="600" fill="#1baf7a">04</text>
  <text x="686" y="187" font-size="13" fill="#1c2630">Collateral against loans</text>
  <text x="658" y="219" font-size="12" font-weight="600" fill="#1baf7a">05</text>
  <text x="686" y="219" font-size="13" fill="#1c2630">History, one row per posting</text>
  <text x="658" y="251" font-size="12" font-weight="600" fill="#1baf7a">06</text>
  <text x="686" y="251" font-size="13" fill="#1c2630">Trend across the four postings</text>

  <!-- output -->
  <rect x="980" y="44" width="240" height="106" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="980" y="44" width="240" height="4" rx="2" fill="#eda100"/>
  <text x="998" y="74" font-size="14" font-weight="600" fill="#1c2630">Write-up</text>
  <text x="998" y="96" font-size="12" fill="#5b6773">docs/readout.html, five charts,</text>
  <text x="998" y="114" font-size="12" fill="#5b6773">every figure queried from the</text>
  <text x="998" y="132" font-size="12" fill="#5b6773">warehouse, not typed in.</text>

  <rect x="980" y="176" width="240" height="106" rx="8" fill="#fbfcfd" stroke="#d8dee6"/>
  <rect x="980" y="176" width="240" height="4" rx="2" fill="#eda100"/>
  <text x="998" y="206" font-size="14" font-weight="600" fill="#1c2630">Power BI report</text>
  <text x="998" y="228" font-size="12" fill="#5b6773">Five CSVs exported as a star</text>
  <text x="998" y="246" font-size="12" fill="#5b6773">schema, one posting dimension</text>
  <text x="998" y="264" font-size="12" fill="#5b6773">and four fact tables.</text>

  <!-- arrows -->
  <g stroke="#9aa5b1" stroke-width="1.5">
    <line x1="286" y1="103" x2="315" y2="103"/>
    <line x1="286" y1="234" x2="315" y2="234"/>
    <line x1="596" y1="103" x2="625" y2="103"/>
    <line x1="596" y1="234" x2="625" y2="234"/>
    <line x1="936" y1="103" x2="965" y2="103"/>
    <line x1="936" y1="234" x2="965" y2="234"/>
  </g>
  <g fill="#9aa5b1">
    <polygon points="315,98 324,103 315,108"/>
    <polygon points="315,229 324,234 315,239"/>
    <polygon points="625,98 634,103 625,108"/>
    <polygon points="625,229 634,234 625,239"/>
    <polygon points="965,98 974,103 965,108"/>
    <polygon points="965,229 974,234 965,239"/>
  </g>

  <!-- tests -->
  <rect x="330" y="346" width="890" height="88" rx="8" fill="#ffffff" stroke="#c9d3dd" stroke-dasharray="5 4"/>
  <text x="352" y="376" font-size="14" font-weight="600" fill="#1c2630">tests/ &#8212; 55 pytest tests, no data and no network needed</text>
  <text x="352" y="400" font-size="12" fill="#5b6773">Each test builds a small quarter with a planted fault (a wrong LEI, a duplicate filing, a placeholder identifier, a filing that</text>
  <text x="352" y="418" font-size="12" fill="#5b6773">contradicts itself) and runs the real SQL files above against it, so the rules are checked rather than assumed.</text>
  <line x1="785" y1="340" x2="785" y2="301" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="780,301 785,292 790,301" fill="#c9d3dd"/>
</svg>
