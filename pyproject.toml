[project]
name = "nport-securities-lending"
version = "0.1.0"
description = "Securities lending and counterparty exposure across US funds, from SEC Form N-PORT"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "dbt-core>=1.8", "dbt-duckdb>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
